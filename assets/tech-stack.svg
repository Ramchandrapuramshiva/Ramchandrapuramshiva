    <!-- Badges -->
    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="154" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" />
      <text x="12" y="17" fill="#F5F1E8" class="sans pill-label">Python</text>

      <rect x="0" y="34" width="154" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 34)" />
      <text x="12" y="51" fill="#F5F1E8" class="sans pill-label">TypeScript</text>

      <rect x="0" y="68" width="154" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 68)" />
      <text x="12" y="85" fill="#F5F1E8" class="sans pill-label">JavaScript (ES6+)</text>

      <rect x="0" y="102" width="154" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 102)" />
      <text x="12" y="119" fill="#F5F1E8" class="sans pill-label">Git &amp; GitHub</text>
    </g>
  </g>
</svg>
