<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="100%" fill="none">
  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .cat-title {
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 11.5px;
    }
    .pill-label {
      font-weight: 500;
      letter-spacing: 0.5px;
      font-size: 11px;
    }
  </style>

  <!-- 1. Background -->
  <rect width="920" height="290" fill="#171A1C" />
  <rect x="2" y="2" width="916" height="286" fill="none" stroke="#234B3B" stroke-width="1" />

  <!-- 2. Header Bar -->
  <g transform="translate(24, 26)">
    <rect x="0" y="0" width="8" height="8" fill="#B8754B" />
    <text x="18" y="8" fill="#F5F1E8" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      VERIFIED TECHNICAL TOOLCHAIN <tspan fill="#737873">//</tspan> PRODUCTION &amp; RESEARCH STACK
    </text>
    <text x="872" y="8" text-anchor="end" fill="#737873" class="mono" font-size="9.5" letter-spacing="1">
      GROUNDED IN ACTUAL REPOSITORIES
    </text>
  </g>
  <line x1="24" y1="42" x2="896" y2="42" stroke="#234B3B" stroke-width="1" />

  <!-- 3. QUADRANT 1: AI & GENAI -->
  <g transform="translate(24, 58)">
    <rect width="206" height="212" fill="#171A1C" stroke="#234B3B" stroke-width="1" />
    <rect x="0" y="0" width="206" height="3" fill="#B8754B" />
    
    <text x="14" y="22" fill="#737873" class="mono" font-size="8.5" letter-spacing="1">01 / INTELLIGENCE</text>
    <text x="14" y="38" fill="#F5F1E8" class="sans cat-title">AI &amp; GENAI</text>
    <line x1="14" y1="46" x2="192" y2="46" stroke="#234B3B" stroke-width="0.8" />

    <!-- Badges -->
    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" />
      <text x="12" y="17" fill="#F5F1E8" class="sans pill-label">Gemini Multimodal API</text>

      <rect x="0" y="34" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 34)" />
      <text x="12" y="51" fill="#F5F1E8" class="sans pill-label">LLM Engineering</text>

      <rect x="0" y="68" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 68)" />
      <text x="12" y="85" fill="#F5F1E8" class="sans pill-label">Web Speech API / TTS</text>

      <rect x="0" y="102" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 102)" />
      <text x="12" y="119" fill="#F5F1E8" class="sans pill-label">OCR &amp; Structured JSON</text>
    </g>
  </g>

  <!-- 4. QUADRANT 2: FRONTEND -->
  <g transform="translate(254, 58)">
    <rect width="206" height="212" fill="#171A1C" stroke="#234B3B" stroke-width="1" />
    <rect x="0" y="0" width="206" height="3" fill="#234B3B" />
    
    <text x="14" y="22" fill="#737873" class="mono" font-size="8.5" letter-spacing="1">02 / INTERFACE</text>
