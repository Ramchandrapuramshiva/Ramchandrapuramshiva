      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 34)" />
      <text x="12" y="51" fill="#F5F1E8" class="sans pill-label">Tailwind CSS (v3 / v4)</text>

      <rect x="0" y="68" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 68)" />
      <text x="12" y="85" fill="#F5F1E8" class="sans pill-label">Vite Build Tool</text>

      <rect x="0" y="102" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#234B3B" transform="translate(0, 102)" />
      <text x="12" y="119" fill="#F5F1E8" class="sans pill-label">HTML5 &amp; CSS3</text>
    </g>
  </g>

  <!-- 5. QUADRANT 3: BACKEND & DATA -->
  <g transform="translate(484, 58)">
    <rect width="206" height="212" fill="#171A1C" stroke="#234B3B" stroke-width="1" />
    <rect x="0" y="0" width="206" height="3" fill="#B8754B" />
    
    <text x="14" y="22" fill="#737873" class="mono" font-size="8.5" letter-spacing="1">03 / RUNTIME &amp; DATA</text>
    <text x="14" y="38" fill="#F5F1E8" class="sans cat-title">BACKEND &amp; DATA</text>
    <line x1="14" y1="46" x2="192" y2="46" stroke="#234B3B" stroke-width="0.8" />

    <!-- Badges -->
    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" />
      <text x="12" y="17" fill="#F5F1E8" class="sans pill-label">Node.js Runtime</text>

      <rect x="0" y="34" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 34)" />
      <text x="12" y="51" fill="#F5F1E8" class="sans pill-label">Express.js APIs</text>

      <rect x="0" y="68" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 68)" />
      <text x="12" y="85" fill="#F5F1E8" class="sans pill-label">Supabase (PostgreSQL)</text>

      <rect x="0" y="102" width="178" height="26" fill="#171A1C" stroke="#737873" stroke-width="0.8" />
      <rect x="0" y="0" width="4" height="26" fill="#B8754B" transform="translate(0, 102)" />
      <text x="12" y="119" fill="#F5F1E8" class="sans pill-label">Firebase (Auth / Rules)</text>
    </g>
  </g>

  <!-- 6. QUADRANT 4: LANGUAGES & TOOLS -->
  <g transform="translate(714, 58)">
    <rect width="182" height="212" fill="#171A1C" stroke="#234B3B" stroke-width="1" />
    <rect x="0" y="0" width="182" height="3" fill="#234B3B" />
    
    <text x="14" y="22" fill="#737873" class="mono" font-size="8.5" letter-spacing="1">04 / CORE &amp; TOOLS</text>
    <text x="14" y="38" fill="#F5F1E8" class="sans cat-title">LANGUAGES &amp; TOOLS</text>
