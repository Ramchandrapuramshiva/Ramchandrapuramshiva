<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="100%" fill="none">
  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
  </style>

  <!-- 1. Background Frame -->
  <rect width="920" height="110" fill="#171A1C" />
  <rect x="2" y="2" width="916" height="106" fill="none" stroke="#234B3B" stroke-width="1" />
  <rect x="6" y="6" width="908" height="98" fill="none" stroke="#737873" stroke-width="0.5" stroke-dasharray="4 4" />

  <!-- 2. Corner Reticles -->
  <g stroke="#B8754B" stroke-width="1.2">
    <path d="M 12 18 L 12 12 L 18 12" />
    <path d="M 908 18 L 908 12 L 902 12" />
    <path d="M 12 92 L 12 98 L 18 98" />
    <path d="M 908 92 L 908 98 L 902 98" />
  </g>

  <!-- 3. Top Hairline with Solid Traveling Beacon -->
  <g transform="translate(60, 24)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#234B3B" stroke-width="1" />
    <!-- Traveling Solid Calibration Tick -->
    <rect x="0" y="-1.5" width="24" height="3" fill="#B8754B">
      <animateTransform attributeName="transform" type="translate" from="-24,0" to="800,0" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="395" y="-3" width="10" height="6" fill="#171A1C" stroke="#F5F1E8" stroke-width="1" />
  </g>

  <!-- 4. Closing Statement -->
  <g transform="translate(460, 56)" text-anchor="middle">
    <text class="sans" font-size="13" font-weight="700" fill="#F5F1E8" letter-spacing="2.5">
      ENGINEERED WITH DISCIPLINE <tspan fill="#B8754B">&#8226;</tspan> BUILT FOR PRACTICAL UTILITY
    </text>
  </g>

  <!-- 5. Subtitle Meta -->
  <g transform="translate(460, 84)" text-anchor="middle">
    <text class="mono" font-size="10" fill="#D8D3C8" letter-spacing="1.5">
      SHIVA RAMCHANDRAPURAM <tspan fill="#234B3B">|</tspan> HYDERABAD, INDIA <tspan fill="#234B3B">|</tspan> B.TECH CSE (NIAT / NEXTWAVE)
    </text>
  </g>
</svg>
