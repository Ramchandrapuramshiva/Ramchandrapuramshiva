<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cadence-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cadence-glow-1" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cadence-glow-2" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Step Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190B12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pipeline Signal Beam -->
    <linearGradient id="signal-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2" />
    </linearGradient>

    <!-- Moving Dot Laser -->
    <linearGradient id="laser-dot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .header-title {
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>

  <!-- 1. Background -->
  <rect width="920" height="220" rx="12" fill="url(#cadence-bg)" />
  <rect width="920" height="220" rx="12" fill="url(#cadence-glow-1)" />
  <rect width="920" height="220" rx="12" fill="url(#cadence-glow-2)" />

  <!-- 2. Borders -->
  <rect x="1.5" y="1.5" width="917" height="217" rx="11" stroke="#451126" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="6" y="6" width="908" height="208" rx="8" stroke="#701A3D" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="6 4" />

  <!-- 3. Header Bar -->
  <g transform="translate(28, 34)">
    <circle cx="6" cy="6" r="3.5" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#F8F0F3" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">
      DEVELOPMENT CADENCE <tspan fill="#701A3D">//</tspan> CONTINUOUS LEARNING WORKFLOW
    </text>
    <text x="864" y="10" text-anchor="end" fill="#E5B5C7" class="font-mono" font-size="9.5" letter-spacing="1">
      MODE: LEARNING BY BUILDING
    </text>
  </g>

  <!-- 4. Top Divider -->
  <line x1="28" y1="52" x2="892" y2="52" stroke="#451126" stroke-width="1" />

  <!-- 5. Connecting Highway Line -->
  <line x1="120" y1="128" x2="800" y2="128" stroke="#451126" stroke-width="2" />
  <line x1="120" y1="128" x2="800" y2="128" stroke="url(#signal-beam)" stroke-width="2" stroke-dasharray="80 180">
    <animate attributeName="stroke-dashoffset" from="260" to="0" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- 6. Four Workflow Nodes -->
  <!-- NODE 1: RESEARCH & SPECS -->
  <g transform="translate(48, 72)">
    <rect width="186" height="114" rx="8" fill="url(#card-grad)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="186" height="2" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1.5">PHASE 01</text>
    <text x="16" y="44" fill="#F8F0F3" class="font-sans" font-size="12.5" font-weight="700">EXPLORE &amp; MODEL</text>
    <text x="16" y="66" fill="#E5B5C7" class="font-sans" font-size="10.5">Problem analysis</text>
    <text x="16" y="82" fill="#E5B5C7" class="font-sans" font-size="10.5">Prompt &amp; system design</text>
    <text x="16" y="98" fill="#E5B5C7" class="font-sans" font-size="10.5">API boundary definition</text>
    <!-- Node Pip -->
    <circle cx="93" cy="56" r="4.5" fill="#451126" stroke="#C77B9B" stroke-width="1.5" />
    <circle cx="93" cy="56" r="2" fill="#E5B5C7" />
  </g>

  <!-- NODE 2: FULL-STACK BUILD -->
  <g transform="translate(258, 72)">
    <rect width="186" height="114" rx="8" fill="url(#card-grad)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="186" height="2" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1.5">PHASE 02</text>
    <text x="16" y="44" fill="#F8F0F3" class="font-sans" font-size="12.5" font-weight="700">BUILD ARCHITECTURE</text>
    <text x="16" y="66" fill="#E5B5C7" class="font-sans" font-size="10.5">React / Next.js UI</text>
    <text x="16" y="82" fill="#E5B5C7" class="font-sans" font-size="10.5">Node.js &amp; Python APIs</text>
    <text x="16" y="98" fill="#E5B5C7" class="font-sans" font-size="10.5">Component engineering</text>
    <!-- Node Pip -->
    <circle cx="93" cy="56" r="4.5" fill="#451126" stroke="#C77B9B" stroke-width="1.5" />
    <circle cx="93" cy="56" r="2" fill="#E5B5C7" />
  </g>

  <!-- NODE 3: AI INTEGRATION -->
  <g transform="translate(468, 72)">
    <rect width="186" height="114" rx="8" fill="url(#card-grad)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="186" height="2" fill="#C77B9B" />
    <text x="16" y="24" fill="#E5B5C7" class="font-mono" font-size="9" letter-spacing="1.5">PHASE 03</text>
    <text x="16" y="44" fill="#F8F0F3" class="font-sans" font-size="12.5" font-weight="700">AI &amp; AGENT LOGIC</text>
    <text x="16" y="66" fill="#E5B5C7" class="font-sans" font-size="10.5">Gemini API pipelines</text>
    <text x="16" y="82" fill="#E5B5C7" class="font-sans" font-size="10.5">Multimodal analysis</text>
    <text x="16" y="98" fill="#E5B5C7" class="font-sans" font-size="10.5">Speech &amp; Agent loops</text>
    <!-- Node Pip with glow -->
    <circle cx="93" cy="56" r="5" fill="#701A3D" stroke="#E5B5C7" stroke-width="1.8" filter="url(#node-glow)" />
    <circle cx="93" cy="56" r="2.2" fill="#F8F0F3" />
  </g>

  <!-- NODE 4: VERIFY & DEPLOY -->
  <g transform="translate(678, 72)">
    <rect width="186" height="114" rx="8" fill="url(#card-grad)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="186" height="2" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1.5">PHASE 04</text>
    <text x="16" y="44" fill="#F8F0F3" class="font-sans" font-size="12.5" font-weight="700">VERIFY &amp; REFINE</text>
    <text x="16" y="66" fill="#E5B5C7" class="font-sans" font-size="10.5">Git version control</text>
    <text x="16" y="82" fill="#E5B5C7" class="font-sans" font-size="10.5">Vercel live deployment</text>
    <text x="16" y="98" fill="#E5B5C7" class="font-sans" font-size="10.5">Refactoring &amp; lessons</text>
    <!-- Node Pip -->
    <circle cx="93" cy="56" r="4.5" fill="#451126" stroke="#C77B9B" stroke-width="1.5" />
    <circle cx="93" cy="56" r="2" fill="#E5B5C7" />
  </g>
</svg>
