<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="col-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190B12" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="tm-glow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .col-title {
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 12px;
    }
    .item-text {
      font-weight: 500;
      letter-spacing: 0.5px;
      font-size: 11.5px;
    }
  </style>

  <!-- 1. Background -->
  <rect width="920" height="280" rx="12" fill="url(#tm-bg)" />
  <rect width="920" height="280" rx="12" fill="url(#tm-glow)" />

  <!-- 2. Borders -->
  <rect x="1.5" y="1.5" width="917" height="277" rx="11" stroke="#451126" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="6" y="6" width="908" height="268" rx="8" stroke="#701A3D" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="6 4" />

  <!-- 3. Section Title Bar -->
  <g transform="translate(30, 32)">
    <circle cx="6" cy="6" r="3" fill="#C77B9B" />
    <text x="18" y="10" fill="#F8F0F3" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="2">
      VERIFIED TECHNICAL MATRIX <tspan fill="#701A3D">//</tspan> ENGINEERING TOOLCHAIN
    </text>
    <text x="860" y="10" text-anchor="end" fill="#E5B5C7" class="font-mono" font-size="9" letter-spacing="1.5">
      STACK CLASSIFICATION
    </text>
  </g>
  <line x1="30" y1="48" x2="890" y2="48" stroke="#451126" stroke-width="1" />

  <!-- 4. COLUMN 1: AI & DATA -->
  <g transform="translate(30, 62)">
    <rect width="200" height="198" rx="8" fill="url(#col-bg)" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="3" fill="#C77B9B" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1">01 / DISCIPLINE</text>
    <text x="16" y="42" fill="#F8F0F3" class="font-sans col-title">AI &amp; DATA</text>
    <line x1="16" y1="52" x2="184" y2="52" stroke="#451126" stroke-width="0.8" />
    
    <!-- Items -->
    <g transform="translate(16, 68)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="12" r="2.5" fill="#E5B5C7" />
      <text x="20" y="16" fill="#F8F0F3" class="font-sans item-text">Gemini API</text>

      <!-- Item 2 -->
      <rect x="0" y="30" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="42" r="2.5" fill="#E5B5C7" />
      <text x="20" y="46" fill="#F8F0F3" class="font-sans item-text">LLM Engineering</text>

      <!-- Item 3 -->
      <rect x="0" y="60" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="72" r="2.5" fill="#E5B5C7" />
      <text x="20" y="76" fill="#F8F0F3" class="font-sans item-text">Supabase</text>

      <!-- Item 4 -->
      <rect x="0" y="90" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="102" r="2.5" fill="#E5B5C7" />
      <text x="20" y="106" fill="#F8F0F3" class="font-sans item-text">Firebase</text>
    </g>
  </g>

  <!-- 5. COLUMN 2: FRONTEND -->
  <g transform="translate(250, 62)">
    <rect width="200" height="198" rx="8" fill="url(#col-bg)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="200" height="3" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1">02 / INTERFACE</text>
    <text x="16" y="42" fill="#F8F0F3" class="font-sans col-title">FRONTEND</text>
    <line x1="16" y1="52" x2="184" y2="52" stroke="#451126" stroke-width="0.8" />

    <!-- Items -->
    <g transform="translate(16, 68)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="12" r="2.5" fill="#C77B9B" />
      <text x="20" y="16" fill="#F8F0F3" class="font-sans item-text">React</text>

      <!-- Item 2 -->
      <rect x="0" y="30" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="42" r="2.5" fill="#C77B9B" />
      <text x="20" y="46" fill="#F8F0F3" class="font-sans item-text">Next.js</text>

      <!-- Item 3 -->
      <rect x="0" y="60" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="72" r="2.5" fill="#C77B9B" />
      <text x="20" y="76" fill="#F8F0F3" class="font-sans item-text">Tailwind CSS</text>

      <!-- Item 4 -->
      <rect x="0" y="90" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="102" r="2.5" fill="#C77B9B" />
      <text x="20" y="106" fill="#F8F0F3" class="font-sans item-text">Component Design</text>
    </g>
  </g>

  <!-- 6. COLUMN 3: BACKEND & TOOLS -->
  <g transform="translate(470, 62)">
    <rect width="200" height="198" rx="8" fill="url(#col-bg)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="200" height="3" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1">03 / RUNTIME</text>
    <text x="16" y="42" fill="#F8F0F3" class="font-sans col-title">BACKEND &amp; TOOLS</text>
    <line x1="16" y1="52" x2="184" y2="52" stroke="#451126" stroke-width="0.8" />

    <!-- Items -->
    <g transform="translate(16, 68)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="12" r="2.5" fill="#C77B9B" />
      <text x="20" y="16" fill="#F8F0F3" class="font-sans item-text">Node.js</text>

      <!-- Item 2 -->
      <rect x="0" y="30" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="42" r="2.5" fill="#C77B9B" />
      <text x="20" y="46" fill="#F8F0F3" class="font-sans item-text">Express.js</text>

      <!-- Item 3 -->
      <rect x="0" y="60" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="72" r="2.5" fill="#C77B9B" />
      <text x="20" y="76" fill="#F8F0F3" class="font-sans item-text">Git &amp; GitHub</text>

      <!-- Item 4 -->
      <rect x="0" y="90" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="102" r="2.5" fill="#C77B9B" />
      <text x="20" y="106" fill="#F8F0F3" class="font-sans item-text">Vercel Deployment</text>
    </g>
  </g>

  <!-- 7. COLUMN 4: LANGUAGES -->
  <g transform="translate(690, 62)">
    <rect width="200" height="198" rx="8" fill="url(#col-bg)" stroke="#451126" stroke-width="1" />
    <rect x="0" y="0" width="200" height="3" fill="#701A3D" />
    <text x="16" y="24" fill="#C77B9B" class="font-mono" font-size="9" letter-spacing="1">04 / CORE</text>
    <text x="16" y="42" fill="#F8F0F3" class="font-sans col-title">LANGUAGES</text>
    <line x1="16" y1="52" x2="184" y2="52" stroke="#451126" stroke-width="0.8" />

    <!-- Items -->
    <g transform="translate(16, 68)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="12" r="2.5" fill="#C77B9B" />
      <text x="20" y="16" fill="#F8F0F3" class="font-sans item-text">Python</text>

      <!-- Item 2 -->
      <rect x="0" y="30" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="42" r="2.5" fill="#C77B9B" />
      <text x="20" y="46" fill="#F8F0F3" class="font-sans item-text">JavaScript (ES6+)</text>

      <!-- Item 3 -->
      <rect x="0" y="60" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="72" r="2.5" fill="#C77B9B" />
      <text x="20" y="76" fill="#F8F0F3" class="font-sans item-text">TypeScript</text>

      <!-- Item 4 -->
      <rect x="0" y="90" width="168" height="24" rx="4" fill="url(#pill-bg)" stroke="#451126" stroke-width="0.8" />
      <circle cx="10" cy="102" r="2.5" fill="#C77B9B" />
      <text x="20" y="106" fill="#F8F0F3" class="font-sans item-text">HTML5 &amp; CSS3</text>
    </g>
  </g>
</svg>
