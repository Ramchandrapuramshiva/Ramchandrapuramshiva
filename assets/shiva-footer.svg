<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="footer-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <radialGradient id="footer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#451126" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Beam Gradient -->
    <linearGradient id="footer-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#701A3D" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#701A3D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <!-- Light Runner Gradient -->
    <linearGradient id="footer-runner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-text {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .sans-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
  </style>

  <!-- 1. Background Layers -->
  <rect width="920" height="140" rx="12" fill="url(#footer-bg-grad)" />
  <rect width="920" height="140" rx="12" fill="url(#footer-glow)" />

  <!-- 2. Borders -->
  <rect x="1.5" y="1.5" width="917" height="137" rx="11" stroke="#451126" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="6" y="6" width="908" height="128" rx="8" stroke="#701A3D" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="6 4" />

  <!-- 3. Top Architectural Accent Line -->
  <g transform="translate(60, 24)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="url(#footer-laser)" stroke-width="1.5" />
    <!-- Traveling light beacon -->
    <line x1="0" y1="0" x2="120" y2="0" stroke="url(#footer-runner)" stroke-width="2.2" filter="url(#glow-filter)">
      <animateTransform attributeName="transform" type="translate" from="-120,0" to="800,0" dur="4.2s" repeatCount="indefinite" />
    </line>
    <!-- Central Rhombus Marker -->
    <polygon points="400,-5 405,0 400,5 395,0" fill="#E5B5C7" filter="url(#glow-filter)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- 4. Corner Precision Reticles -->
  <g stroke="#C77B9B" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <path d="M 16 24 L 16 16 L 24 16" />
    <path d="M 904 24 L 904 16 L 896 16" />
    <path d="M 16 116 L 16 124 L 24 124" />
    <path d="M 904 116 L 904 124 L 896 124" />
  </g>

  <!-- 5. Central Primary Statement -->
  <g transform="translate(460, 68)" text-anchor="middle">
    <text class="sans-text" font-size="14" font-weight="700" fill="#F8F0F3" letter-spacing="3.5">
      CONTINUOUSLY LEARNING <tspan fill="#701A3D">•</tspan> PRAGMATICALLY BUILDING <tspan fill="#701A3D">•</tspan> EVOLVING DAILY
    </text>
  </g>

  <!-- 6. Bottom Metadata / Identity -->
  <g transform="translate(460, 98)" text-anchor="middle">
    <text class="mono-text" font-size="10.5" fill="#E5B5C7" letter-spacing="2">
      SHIVA RAMCHANDRAPURAM <tspan fill="#701A3D">|</tspan> GITHUB: @RAMCHANDRAPURAMSHIVA <tspan fill="#701A3D">|</tspan> HYDERABAD, INDIA
    </text>
  </g>

  <!-- 7. Micro Endorsement Tag -->
  <g transform="translate(460, 118)" text-anchor="middle">
    <text class="mono-text" font-size="8.5" fill="#C77B9B" opacity="0.75" letter-spacing="1.5">
      AI ENGINEER IN PROGRESS • B.TECH CSE (NIAT / NEXTWAVE)
    </text>
  </g>
</svg>
